; Twilight Warrior for M5Stack Cardputer / Cardputer ADV — ESP-IDF via PlatformIO.
;
; Standard ESP-IDF layout (main/ component + top-level CMakeLists.txt), so it
; also builds with plain `idf.py build`. Same platform as ../cardputer_ai
; (pioarduino, IDF 5.5). One image runs on both boards: M5Unified detects the
; board, the keyboard reader is picked at runtime.
;
; The game data (build/tw.wad) is NOT part of the app image. It lives in the
; raw "wad" partition and is written by tools/flash.sh.

[platformio]
src_dir = main

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
board = m5stack-stamps3
board_build.flash_mode = qio
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
